name: Java Spring CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check-syntax:
    name: Check cú pháp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cấp quyền chạy gradlew
        run: chmod +x gradlew

      - name: Kiểm tra cú pháp (biên dịch code và test)
        run: ./gradlew compileJava compileTestJava --no-daemon

  build-test-package:
    name: Build, Test, Package
    runs-on: ubuntu-latest
    needs: check-syntax
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cấp quyền chạy gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble --no-daemon

      - name: Chạy test
        run: ./gradlew test --no-daemon

      - name: Upload báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: warn
          retention-days: 7

      - name: Package
        run: ./gradlew bootJar --no-daemon

      - name: Upload file jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-api-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
